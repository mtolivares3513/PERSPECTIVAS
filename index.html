  libreCache().free.forEach(h=>{const d=(h.x-ptr.x)**2+(h.y-ptr.y)**2;if(d<d2){d2=d;best=h}});
  if(best)girar(best.v,(cw?-1:1)*(e.button===2?-1:1));
});
const soltar=e=>{const p=pos(e),b=hit(p.x,p.y);if(b&&b.id===pressed)b.fn();pressed=null;if(e.pointerType==='touch')ptr=null};
